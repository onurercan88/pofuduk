name: iOS build & test
on: [push, pull_request]
jobs:
  core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cd PofudukCore && swift test
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: >
          xcodebuild test -project Pofuduk.xcodeproj -scheme Pofuduk
          -destination 'platform=iOS Simulator,name=iPhone 15'
          CODE_SIGNING_ALLOWED=NO | tail -n 60
