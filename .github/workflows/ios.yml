name: iOS build & test
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd PofudukCore && swift test
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build and test on first available iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -version
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $SIM_ID"
          xcodebuild test -project Pofuduk.xcodeproj -scheme Pofuduk \
            -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "error:|warning: .*Pofuduk|Test Case .*(passed|failed)|\*\* (BUILD|TEST)" | head -n 200
