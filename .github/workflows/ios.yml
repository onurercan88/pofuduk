name: iOS build & test
on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd PofudukCore && swift test
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build and test on first available iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -version
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $SIM_ID"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcodebuild test -project Pofuduk.xcodeproj -scheme Pofuduk -derivedDataPath build \
            -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "error:|warning: .*Pofuduk|Test Case .*(passed|failed)|\*\* (BUILD|TEST)" | head -n 200
      - name: Screenshots (every demo scenario, light + dark)
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Pofuduk.app
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$SIM_ID" "$APP"
          mkdir -p screenshots
          shoot() { # scenario appearance
            xcrun simctl ui "$SIM_ID" appearance "$2"
            xcrun simctl terminate "$SIM_ID" com.pofuduk.app 2>/dev/null || true
            xcrun simctl launch "$SIM_ID" com.pofuduk.app -pofuduk.demoScenario "$1"
            sleep "${3:-8}"
            xcrun simctl io "$SIM_ID" screenshot "screenshots/$1-$2.png"
          }
          for s in sunny rainyAfternoon stormy snowy cloudy windy; do shoot "$s" light; done
          for s in sunny rainyAfternoon stormy; do shoot "$s" dark; done
          # Clothing detail sheet (demo, light)
          xcrun simctl ui "$SIM_ID" appearance light
          xcrun simctl terminate "$SIM_ID" com.pofuduk.app 2>/dev/null || true
          xcrun simctl launch "$SIM_ID" com.pofuduk.app -pofuduk.demoScenario windy -pofuduk.openClothing YES
          sleep 8
          xcrun simctl io "$SIM_ID" screenshot "screenshots/clothing-windy-light.png"
          # "live" is not a demo scenario → first-launch location explanation sheet
          shoot live light 10
          # Manual province (Ankara, plate 6) → real Open-Meteo data (no key in CI)
          xcrun simctl terminate "$SIM_ID" com.pofuduk.app 2>/dev/null || true
          xcrun simctl launch "$SIM_ID" com.pofuduk.app -pofuduk.manualPlate 6
          sleep 40
          xcrun simctl io "$SIM_ID" screenshot "screenshots/live-ankara-light.png"
          echo "--- host reachability"
          curl -s --max-time 10 -o /dev/null -w "open-meteo %{http_code} %{time_total}s\n" "https://api.open-meteo.com/v1/forecast?latitude=39.93&longitude=32.86&current=temperature_2m" || true
          echo "--- app network log"
          xcrun simctl spawn "$SIM_ID" log show --last 5m --style compact --predicate 'subsystem == "com.pofuduk.app"' | tail -n 20 || true
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
