name: TestFlight
# Manual only: GitHub › Actions › TestFlight › Run workflow (or `gh workflow run testflight.yml`).
# Needs repository secrets ASC_ISSUER_ID, ASC_KEY_ID, ASC_PRIVATE_KEY, APPLE_TEAM_ID
# and the repository variable APP_BUNDLE_ID (see DEVICE_TESTING.md, Yol B).
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=""
          for v in ASC_ISSUER_ID ASC_KEY_ID ASC_PRIVATE_KEY TEAM_ID BUNDLE_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets/variables:$missing (see DEVICE_TESTING.md, Yol B)"
            exit 1
          fi

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Write API key (temporary, never logged)
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive (automatic signing via App Store Connect API key)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Pofuduk.xcodeproj -scheme Pofuduk -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Pofuduk.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 \
            | grep -E "error:|warning: .*(sign|provision)|\*\* ARCHIVE" | head -n 100

      - name: Export and upload to App Store Connect / TestFlight
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Pofuduk.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 \
            | grep -E "error:|Upload|EXPORT|\*\*" | head -n 100

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
