name: TestFlight
# Manual only: GitHub › Actions › TestFlight › Run workflow (or `gh workflow run testflight.yml`).
# Needs repository secrets ASC_ISSUER_ID, ASC_KEY_ID, ASC_PRIVATE_KEY, APPLE_TEAM_ID
# and the repository variable APP_BUNDLE_ID (see DEVICE_TESTING.md, Yol B).
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=""
          for v in ASC_ISSUER_ID ASC_KEY_ID ASC_PRIVATE_KEY TEAM_ID BUNDLE_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets/variables:$missing (see DEVICE_TESTING.md, Yol B)"
            exit 1
          fi

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Write API key (temporary, never logged)
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive (unsigned; export signs it for distribution)
        # Archiving with automatic signing needs a development profile, which needs a
        # registered device. The export step creates the App Store distribution
        # certificate/profile via the API key instead (no device needed).
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Pofuduk.xcodeproj -scheme Pofuduk -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Pofuduk.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 \
            | grep -E "error:|warning: .*(sign|provision)|\*\* ARCHIVE" | head -n 100

      - name: Carry entitlements into the unsigned archive
        # An unsigned app has no entitlements, so export would drop WeatherKit. An ad-hoc signature
        # embeds them; export re-signs with the distribution profile and keeps them.
        run: |
          APP=build/Pofuduk.xcarchive/Products/Applications/Pofuduk.app
          codesign --force --sign - --entitlements Pofuduk/Resources/Pofuduk.entitlements "$APP"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "com.apple.developer.weatherkit" \
            || { echo "::error::WeatherKit entitlement missing in archive"; exit 1; }

      - name: Export IPA and verify entitlements
        run: |
          set -o pipefail
          cat > build/ExportOptions-export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Pofuduk.xcarchive -exportOptionsPlist build/ExportOptions-export.plist -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 \
            | grep -E "error:|EXPORT|\*\*" | head -n 100
          mkdir -p build/check && unzip -q build/ipa/*.ipa -d build/check
          codesign -d --entitlements - --xml build/check/Payload/Pofuduk.app 2>/dev/null > build/check/entitlements.plist
          if grep -A1 "com.apple.developer.weatherkit" build/check/entitlements.plist | grep -q "<true/>"; then
            echo "WeatherKit entitlement present in signed IPA"
          else
            echo "::error::Signed IPA lacks the WeatherKit entitlement"; cat build/check/entitlements.plist; exit 1
          fi

      - name: Upload to App Store Connect / TestFlight
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Pofuduk.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 \
            | grep -E "error:|Upload|EXPORT|\*\*" | head -n 100

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
